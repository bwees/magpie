# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: magpie

before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build

builds:
  - id: magpie
    dir: server
    main: .
    binary: magpie
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: magpie
    ids:
      - magpie
    formats:
      - tar.gz
    files:
      - src: web/build/**/*
        dst: web

dockers_v2:
  - id: magpie
    ids:
      - magpie
    images:
      - ghcr.io/{{ .Env.REGISTRY_IMAGE }}
    tags:
      - "v{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    extra_files:
      - web/build
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
