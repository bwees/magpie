# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: magpie

before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build

builds:
  - id: magpie
    dir: server
    main: .
    binary: magpie
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X magpie/internal/adapters/opensubtitles.AppKey={{ envOrDefault "OPENSUBTITLES_APP_KEY" "" }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: magpie-agent
    dir: server
    main: ./agent
    binary: magpie-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: magpie
    ids:
      - magpie
    formats:
      - tar.gz
    files:
      - src: web/build/**/*
        dst: web

dockers_v2:
  - id: magpie
    ids:
      - magpie
    images:
      - ghcr.io/{{ envOrDefault "REGISTRY_IMAGE" "bwees/magpie" }}
    tags:
      - "v{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    extra_files:
      - web/build
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

  - id: magpie-agent
    ids:
      - magpie-agent
    images:
      - ghcr.io/{{ envOrDefault "REGISTRY_IMAGE" "bwees/magpie" }}-agent
    tags:
      - "v{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
    dockerfile: Dockerfile.agent
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}-agent"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

release:
  mode: keep-existing

changelog:
  disable: true
